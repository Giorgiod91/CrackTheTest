<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tech Stack</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #0d0c1e;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Background glow blobs */
  .blob1 {
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,112,91,0.12) 0%, transparent 70%);
    top: -100px; left: -100px;
    pointer-events: none;
  }
  .blob2 {
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%);
    bottom: -80px; right: 50px;
    pointer-events: none;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
    position: relative;
    z-index: 1;
  }

  .header .name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.25);
    margin-bottom: 8px;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(135deg, #FF705B, #FFB457);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    position: relative;
    z-index: 1;
    padding: 0 40px;
  }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: var(--glow);
    opacity: 0;
  }

  .icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }

  .card-name {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.75);
    text-align: center;
    letter-spacing: 0.3px;
  }

  .card-tag {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    text-align: center;
  }

  .footer {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
    position: relative;
    z-index: 1;
  }

  .footer-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #FF705B;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .footer-text {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    font-weight: 500;
    letter-spacing: 1px;
  }
</style>
</head>
